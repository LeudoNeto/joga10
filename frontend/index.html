<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logojoga10.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Joga10 — Gestão de Peladas</title>
    <meta name="description" content="Organize peladas: grupos, jogadores, sorteio de times e estatísticas." />
    <script>
      // Apply the saved theme before the first paint (dark is the default).
      try {
        if (localStorage.getItem("joga10_theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="theme-color"]').content = "#f6f6f7";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
